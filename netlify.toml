[build]
  # Put the plugin next to the demo pages, then publish that tree. Avoids a
  # Netlify UI "publish directory" mismatch leaving an old /plugin on the CDN.
  command = "rm -rf public/plugin && cp -R plugin public/plugin && mkdir -p dist && rm -rf dist/* && cp -R public/. dist/ && (node scripts/fetch-vendor.mjs dist/vendor/mediapipe || true)"
  publish = "dist"

[[headers]]
  for = "/plugin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
